name: Release Linux Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload Linux assets to, e.g. v0.9.6'
        required: true
        default: 'v0.9.6'

concurrency:
  group: release-linux-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Resolve release version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libxdo-dev \
            patchelf \
            zstd

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri Linux packages
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          configPath: src-tauri/tauri.release.conf.json
          args: '--bundles appimage deb'

      - name: Build Arch package
        run: scripts/package-arch.sh "$RELEASE_VERSION"

      - name: Create release asset names
        run: |
          mkdir -p release-files
          cp src-tauri/target/release/bundle/deb/*.deb \
            "release-files/VoxPen.Desktop_${RELEASE_VERSION}_amd64.deb"
          cp src-tauri/target/release/bundle/appimage/*.AppImage \
            "release-files/VoxPen.Desktop_${RELEASE_VERSION}_amd64.AppImage"
          cp src-tauri/target/release/bundle/arch/*.pkg.tar.zst \
            "release-files/VoxPen.Desktop_${RELEASE_VERSION}_x86_64.pkg.tar.zst"

          for sig in src-tauri/target/release/bundle/appimage/*.sig; do
            [ -f "$sig" ] || continue
            cp "$sig" "release-files/VoxPen.Desktop_${RELEASE_VERSION}_amd64.AppImage.sig"
          done

          ls -la release-files/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ env.RELEASE_VERSION }}
          path: release-files/*
          if-no-files-found: error

  publish-linux:
    name: Upload Linux assets to release
    needs: build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve release tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Show release files
        run: ls -la release-files/

      - name: Upload Linux assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-files/*
